<!-- back.html - do not delete this line nor modify. v0.2 -->
<div class="front-text" id="back-container">
  {{Front}}
</div>

<!-- Hidden Answer Reference -->
<div id="correct-answer-index" style="display: none;">{{Back}}</div>

<script>
(function initBackAndGrade() {
  const targetElement = document.getElementById("correct-answer-index");
  const rawText = targetElement ? targetElement.innerText.trim() : "";
  const match = rawText.match(/\d+/);
  const correctIndex = match ? parseInt(match[0], 10) : null;

  const savedSelected = sessionStorage.getItem("anki_selected");
  const selectedIndex = savedSelected !== null ? parseInt(savedSelected, 10) : null;

  const savedChoicesStr = sessionStorage.getItem("anki_choices");
  const container = document.getElementById("back-container");

  if (savedChoicesStr && container) {
    const choices = JSON.parse(savedChoicesStr);
    const header = sessionStorage.getItem("anki_header") || "";
    const isNoTitle = !header.trim();

    // 1. Capture intact <img> and <svg> elements from the DOM
    const mediaElements = Array.from(container.querySelectorAll("img, svg"));
    const mediaHTML = mediaElements.map(el => el.outerHTML).join("");

    // 2. Format choices with correctness styling
    const formattedChoices = choices.map(item => {
      let statusClass = "";
      if (item.originalIndex === correctIndex) {
        statusClass = "correct";
      } else if (item.originalIndex === selectedIndex) {
        statusClass = "wrong";
      }

      return `<div class="choice-btn ${statusClass}"><span class="choice-text">${item.text}</span></div>`;
    });

    // 3. Rebuild header & choices container matching Front template structure
    const headerSection = `
      <div class="header-container ${isNoTitle ? 'no-title' : ''}">
        ${header ? `<div class="front-header">${header}</div>` : ''}
        ${mediaHTML ? `<div class="header-image">${mediaHTML}</div>` : ''}
      </div>`;

    const wrapperClass = isNoTitle ? 'choices-wrapper two-column' : 'choices-wrapper';
    container.innerHTML = headerSection + `<div class="${wrapperClass}">` + formattedChoices.join("") + `</div>`;
  }

  // Auto-grade timing (50ms if correct, 3000ms if wrong)
  const isCorrect = (selectedIndex === correctIndex);
  const ease = isCorrect ? 3 : 1;
  const autoGradeDelay = isCorrect ? 50 : 3000;

  setTimeout(() => {
    if (typeof pycmd !== "undefined") {
      pycmd("ease" + ease);
    } else if (typeof AnkiDroidJS !== "undefined") {
      AnkiDroidJS.answerCard(ease);
    }
  }, autoGradeDelay);
})();
</script>
