<!-- front.html - do not delete this line nor modify. v0.2 -->
<div class="front-text">
  {{Front}}
</div>

<script>
(function initFront() {
  sessionStorage.removeItem("anki_selected");
  sessionStorage.removeItem("anki_choices");

  const container = document.querySelector(".front-text");
  if (!container) return;

  // 1. Extract intact <img> and <svg> elements directly from the DOM
  const mediaElements = Array.from(container.querySelectorAll("img, svg"));
  const mediaHTML = mediaElements.map(el => el.outerHTML).join("");
  const firstMedia = container.querySelector("img, svg");

  // 2. Check if there is actual text BEFORE the first media element
  let textBeforeMedia = "";
  if (firstMedia) {
    try {
      const range = document.createRange();
      range.setStart(container, 0);
      range.setEndBefore(firstMedia);
      textBeforeMedia = range.toString().replace(/\s+/g, " ").trim();
    } catch (e) {
      textBeforeMedia = "";
    }
  }

  // 3. Clone container and strip media so internal SVG <text> labels don't become choices
  const textClone = container.cloneNode(true);
  textClone.querySelectorAll("img, svg").forEach(el => el.remove());

  // 4. Convert HTML line breaks to \n and extract clean lines
  let rawTextHTML = textClone.innerHTML
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/div>/gi, "\n")
    .replace(/<\/p>/gi, "\n");

  let tempDiv = document.createElement("div");
  tempDiv.innerHTML = rawTextHTML;
  let cleanText = tempDiv.textContent || "";

  let lines = cleanText.split("\n").map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) return;

  let headerText = "";
  let choiceLines = [];

  // 5. Separate Title vs Choices
  if (textBeforeMedia.length > 0) {
    headerText = lines[0];
    choiceLines = lines.slice(1);
  } else if (firstMedia) {
    // Media came first with no preceding title text
    headerText = "";
    choiceLines = lines;
  } else {
    // No media present
    if (lines.length > 1) {
      headerText = lines[0];
      choiceLines = lines.slice(1);
    } else {
      headerText = lines[0];
      choiceLines = [];
    }
  }

  if (choiceLines.length === 0) return;

  // 6. Clean choice prefixes (e.g. A:, 1., a))
  let choices = choiceLines.map((text, idx) => {
    let cleanChoiceText = text.replace(/^\s*([a-zA-Z0-9_-]*[:\.\)])?\s*/, "").trim();
    return {
      text: cleanChoiceText || text.trim(),
      originalIndex: idx + 1
    };
  });

  // 7. Fisher-Yates Shuffle
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  sessionStorage.setItem("anki_choices", JSON.stringify(choices));
  sessionStorage.setItem("anki_header", headerText);

  const isNoTitle = !headerText;

  // 8. Render Header & Choices
  const headerSection = `
    <div class="header-container ${isNoTitle ? 'no-title' : ''}">
      ${headerText ? `<div class="front-header">${headerText}</div>` : ''}
      ${mediaHTML ? `<div class="header-image">${mediaHTML}</div>` : ''}
    </div>`;

  const formattedChoices = choices.map(item => {
    return `<div class="choice-btn" data-index="${item.originalIndex}" onclick="selectChoice(this, ${item.originalIndex})" ondblclick="confirmChoice(this, ${item.originalIndex})"><span class="choice-text">${item.text}</span></div>`;
  });

  const wrapperClass = isNoTitle ? 'choices-wrapper two-column' : 'choices-wrapper';
  container.innerHTML = headerSection + `<div class="${wrapperClass}">` + formattedChoices.join("") + `</div>`;
})();

function selectChoice(btn, index) {
  sessionStorage.setItem("anki_selected", index);
  document.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}

function confirmChoice(btn, index) {
  selectChoice(btn, index);
  if (typeof pycmd !== "undefined") {
    pycmd("ans");
  } else if (typeof AnkiDroidJS !== "undefined") {
    AnkiDroidJS.showAnswer();
  }
}
</script>
