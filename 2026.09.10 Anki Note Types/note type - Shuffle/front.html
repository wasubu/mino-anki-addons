<style>
  .video-wrapper {
    position: relative;
    display: inline-block;
    max-width: 100%;
    margin: 0 auto 12px auto;
    cursor: pointer;
    border-radius: 8px;
    overflow: hidden;
  }
  .video-wrapper video {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .video-wrapper:hover .video-overlay {
    opacity: 1;
  }
  .video-overlay-icon {
    background: transparent;
    border-radius: 50%;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shuffle-container .word-chip.locked-chip {
    background-color: #e8f5e9 !important;
    color: #2e7d32 !important;
    border: 1px solid #a5d6a7 !important;
    cursor: pointer !important;
    user-select: none;
  }
  .shuffle-container .word-chip.locked-chip:hover {
    background-color: #d1f2eb !important;
  }
  .target-box .placeholder-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed #b0bec5;
    border-radius: 8px;
    padding: 6px 14px;
    color: #78909c;
    font-size: 0.85em;
    background-color: rgba(236, 239, 241, 0.4);
    user-select: none;
    pointer-events: none;
    margin: 3px;
    line-height: 1.2;
  }

  @keyframes glide {
  from {
    translate: var(--dx) var(--dy);
  }
  to {
    translate: 0 0;
  }
}

@keyframes pop {
  0%, 100% {
    scale: 1;
  }
  50% {
    scale: 1.4;
  }
}
</style>

<div class="shuffle-container {{#Video}}has-video{{/Video}}">
  {{#Video}}
  <div class="video-wrapper" onclick="replayVideo()">
    <video id="card-video" src="{{Video}}" autoplay playsinline></video>
    <div class="video-overlay">
      <div class="video-overlay-icon">
        <svg width="70" height="70" viewBox="0 0 24 24">
          <path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.252 4v5H9M5.07 8a8 8 0 1 1-.818 6"/>
        </svg>
      </div>
    </div>
  </div>
  {{/Video}}

  {{#Translation}}
  <div class="translation-hint">
    {{Translation}}
  </div>
  {{/Translation}}

  <div class="status-header">
    <span id="feedback-badge" class="feedback-badge"></span>
  </div>

  <div id="target-box" class="word-box target-box">
    <div class="placeholder-box">Tap or drag words here...</div>
  </div>

  <div id="source-box" class="word-box source-box"></div>

  <div id="hidden-sentence" style="display:none;">{{Sentence}}</div>
  <div id="hidden-dummy" style="display:none;">{{dummy}}</div>

  <div class="controls">
    <div class="btn-reset" role="button" onclick="resetShuffle()">↺ Reset</div>
  </div>
</div>

<script>
(function() {
  if (document.getElementById('anki-back-flag')) return;

  window.replayVideo = function() {
    var vid = document.getElementById('card-video');
    if (vid) {
      vid.currentTime = 0;
      vid.muted = false;
      vid.play();
    }
  };

  setTimeout(function() {
    window.scrollTo(0, 0);
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }
  }, 150);

  var sentenceElem = document.getElementById('hidden-sentence');
  if (!sentenceElem) return;

  var originalText = sentenceElem.innerText.trim();
  if (!originalText) return;

  var originalWords = originalText.split(/\s+/).filter(Boolean);
  var isLongSentence = originalWords.length >= 6;
  var numDummies = originalWords.length <= 5 ? 2 : 1;

  function normalize(w) {
    return (w || '').toLowerCase().replace(/[^\w]/g, '');
  }

  var originalNormSet = new Set(originalWords.map(normalize));

  var dummyElem = document.getElementById('hidden-dummy');
  var dummyRaw = (dummyElem ? dummyElem.innerText.trim() : '');
  if (!dummyRaw) {
    dummyRaw = 'english';
  }

  function filterValidDummies(list) {
    return list.filter(function(cand) {
      var trimmed = cand.trim();
      return trimmed.length > 0 && !originalNormSet.has(normalize(trimmed));
    });
  }

  function shuffle(array) {
    var arr = array.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;
    }
    return arr;
  }

  function pickDummies(candidates, count) {
    var validList = filterValidDummies(candidates);
    var shuffled = shuffle(validList);
    return shuffled.slice(0, count);
  }

  function startWithDummies(dummyWords) {
    var lockedItem = null;
    var movableWords = [];

    if (isLongSentence) {
      var lastIdx = originalWords.length - 1;
      lockedItem = { id: 'lock-last', text: originalWords[lastIdx], locked: true };
      movableWords = originalWords.slice(0, lastIdx);
    } else {
      movableWords = originalWords.slice();
    }

    var fullPool = movableWords.concat(dummyWords).map(function(w, i) {
      return { id: i + 1, text: w };
    });

    var available = shuffle(fullPool);
    var selected = [];
    var draggedData = null;
    var hasAnimatedLock = false;

    var placeholder = document.createElement('div');
    placeholder.className = 'chip-placeholder';

    function removePlaceholder() {
      if (placeholder.parentNode) {
        placeholder.parentNode.removeChild(placeholder);
      }
    }

    function getDragAfterElement(container, x, y) {
      var chips = Array.from(container.querySelectorAll('.word-chip:not(.dragging):not(.locked-chip)'));
      for (var i = 0; i < chips.length; i++) {
        var box = chips[i].getBoundingClientRect();
        var boxCenter = box.left + box.width / 2;
        if (y < box.bottom && (y < box.top || x < boxCenter)) {
          return chips[i];
        }
      }
      return null;
    }

    function saveState() {
      var userText = selected.map(function(i) { return i.text; }).join(' ');
      var unusedWords = available.map(function(i) { return i.text; });
      var isCorrect = (userText === originalWords.join(' '));
      var payload = JSON.stringify({
        sentence: originalText,
        userText: userText,
        unusedWords: unusedWords,
        isCorrect: isCorrect
      });
      try {
        localStorage.setItem("anki_shuffle_state", payload);
      } catch(e) {}
      try {
        window.name = payload;
      } catch(e) {}
    }

    function renderBoxes() {
      removePlaceholder();
      var targetBox = document.getElementById('target-box');
      var sourceBox = document.getElementById('source-box');
      if (!targetBox || !sourceBox) return;

      targetBox.innerHTML = '';
      sourceBox.innerHTML = '';

      var userWordsCount = selected.filter(function(i) { return !i.locked; }).length;

      if (userWordsCount === 0) {
        var phBox = document.createElement('div');
        phBox.className = 'placeholder-box';
        phBox.innerText = 'Tap or drag words here...';
        targetBox.appendChild(phBox);
      }

      selected.forEach(function(item, index) {
        targetBox.appendChild(createChip(item, 'target', index));
      });

      available.forEach(function(item, index) {
        sourceBox.appendChild(createChip(item, 'source', index));
      });

      saveState();
      setupBoxEvents(targetBox, sourceBox);
    }

    function render() {
      var targetBox = document.getElementById('target-box');
      var sourceBox = document.getElementById('source-box');
      if (!targetBox || !sourceBox) return;

      if (isLongSentence && !hasAnimatedLock) {
        // 1. Add locked word to end of source pool to measure its start position
        available.push(lockedItem);
        renderBoxes();

        var sourceElem = sourceBox.querySelector('[data-lock="true"]');
        var startRect = sourceElem ? sourceElem.getBoundingClientRect() : null;

        // 2. Remove locked word from source pool and place it in target box
        available.pop();
        selected = [lockedItem];
        renderBoxes();

        // 3. Animate locked word from source position to target box
        var targetElem = targetBox.querySelector('[data-lock="true"]');

        if (sourceElem && targetElem && startRect) {
          var endRect = targetElem.getBoundingClientRect();
          var dx = startRect.left - endRect.left;
          var dy = startRect.top - endRect.top;

          targetElem.classList.remove('locked-chip');
          targetElem.style.setProperty('--dx', dx + 'px');
          targetElem.style.setProperty('--dy', dy + 'px');
          targetElem.style.translate = dx + 'px ' + dy + 'px';

          targetElem.offsetHeight;

          // 400ms delay before starting synchronized animations
          setTimeout(function() {
            targetElem.classList.add('locked-chip');
            targetElem.style.animation = 'glide 0.55s ease-in-out forwards, pop 0.55s ease-in-out forwards';
          }, 400);

          // Reset inline styles after 1000ms total
          setTimeout(function() {
            if (targetElem) {
              targetElem.style.animation = '';
              targetElem.style.translate = '';
              targetElem.style.removeProperty('--dx');
              targetElem.style.removeProperty('--dy');
            }
          }, 1000);
        }

        hasAnimatedLock = true;
      } else {
        renderBoxes();
      }
    }

    function createChip(item, location, index) {
      var chip = document.createElement('div');
      chip.setAttribute('role', 'button');

      if (item.locked) {
        chip.dataset.lock = "true";
        chip.className = 'word-chip active-chip locked-chip';
        chip.innerText = item.text;
        chip.draggable = false;
        chip.onclick = function(e) { e.stopPropagation(); };
        return chip;
      }

      chip.className = 'word-chip' + (location === 'target' ? ' active-chip' : '');
      chip.innerText = item.text;
      chip.draggable = true;

      chip.onclick = function() {
        if (location === 'target') {
          selected.splice(index, 1);
          available.push(item);
        } else {
          available.splice(index, 1);
          if (isLongSentence) {
            selected.splice(selected.length - 1, 0, item);
          } else {
            selected.push(item);
          }
        }
        render();
      };

      chip.addEventListener('dragstart', function(e) {
        draggedData = { item: item, location: location, index: index };
        chip.classList.add('dragging');
        placeholder.style.width = chip.offsetWidth + 'px';
        e.dataTransfer.effectAllowed = 'move';
      });

      chip.addEventListener('dragend', function() {
        chip.classList.remove('dragging');
        removePlaceholder();
        draggedData = null;
      });

      return chip;
    }

    function setupBoxEvents(targetBox, sourceBox) {
      targetBox.ondragover = function(e) {
        e.preventDefault();
        if (!draggedData) return;
        var phBox = targetBox.querySelector('.placeholder-box');
        if (phBox) phBox.style.display = 'none';
        
        var afterElement = getDragAfterElement(targetBox, e.clientX, e.clientY);
        var lockedElem = targetBox.querySelector('.locked-chip');

        if (afterElement) {
          targetBox.insertBefore(placeholder, afterElement);
        } else if (lockedElem) {
          targetBox.insertBefore(placeholder, lockedElem);
        } else {
          targetBox.appendChild(placeholder);
        }
      };

      targetBox.ondragleave = function(e) {
        if (e.target === targetBox && !targetBox.contains(e.relatedTarget)) {
          removePlaceholder();
          var phBox = targetBox.querySelector('.placeholder-box');
          var userWordsCount = selected.filter(function(i) { return !i.locked; }).length;
          if (phBox && userWordsCount === 0) {
            phBox.style.display = 'inline-flex';
          }
        }
      };

      targetBox.ondrop = function(e) {
        e.preventDefault();
        if (!draggedData) return;
        var children = Array.from(targetBox.querySelectorAll('.word-chip:not(.dragging), .chip-placeholder'));
        var insertIndex = children.indexOf(placeholder);
        if (insertIndex === -1) insertIndex = selected.length;

        if (draggedData.location === 'source') {
          available.splice(draggedData.index, 1);
          if (isLongSentence) {
            insertIndex = Math.min(insertIndex, selected.length - 1);
          }
        } else {
          selected.splice(draggedData.index, 1);
          if (draggedData.index < insertIndex) insertIndex--;
          if (isLongSentence) {
            insertIndex = Math.min(insertIndex, selected.length - 1);
          }
        }

        insertIndex = Math.max(0, insertIndex);
        selected.splice(insertIndex, 0, draggedData.item);
        render();
      };

      sourceBox.ondragover = function(e) {
        e.preventDefault();
        removePlaceholder();
      };

      sourceBox.ondrop = function(e) {
        e.preventDefault();
        if (!draggedData || draggedData.item.locked) return;
        if (draggedData.location === 'target') {
          selected.splice(draggedData.index, 1);
          available.push(draggedData.item);
          render();
        }
      };
    }

    window.resetShuffle = function() {
      available = shuffle(fullPool);
      selected = [];
      hasAnimatedLock = false;
      render();
    };

    render();
  }

  if (dummyRaw.includes(',')) {
    var rawList = dummyRaw.split(',');
    var picked = pickDummies(rawList, numDummies);
    startWithDummies(picked);
  } else {
    fetch('_dummyWords.json')
      .then(function(res) {
        if (!res.ok) throw new Error('File not found');
        return res.json();
      })
      .then(function(json) {
        var candidates = json[dummyRaw];
        if (Array.isArray(candidates)) {
          var picked = pickDummies(candidates, numDummies);
          if (picked.length > 0) {
            startWithDummies(picked);
            return;
          }
        }
        fallbackSingle();
      })
      .catch(function() {
        fallbackSingle();
      });

    function fallbackSingle() {
      var picked = pickDummies([dummyRaw], numDummies);
      startWithDummies(picked);
    }
  }
})();
</script>
