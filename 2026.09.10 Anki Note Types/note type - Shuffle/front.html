<script>
(function() {
  if (document.getElementById('anki-back-flag')) return;

  // --- Search Mode Jiggle Sync Observer ---
  var searchBtn = document.getElementById('btn-search');
  var shuffleContainer = document.querySelector('.shuffle-container');
  if (searchBtn && shuffleContainer) {
    var observer = new MutationObserver(function() {
      if (searchBtn.classList.contains('search-mode-active')) {
        shuffleContainer.classList.add('search-active');
      } else {
        shuffleContainer.classList.remove('search-active');
      }
    });
    observer.observe(searchBtn, { attributes: true, attributeFilter: ['class'] });
  }

  // --- Timing Sync Engine ---
  var timingElem = document.getElementById('hidden-timing');
  var timingRaw = timingElem ? timingElem.innerText.trim() : '';
  var intervals = timingRaw ? timingRaw.split(',').map(function(s) { return parseFloat(s.trim()) || 0; }) : [];

  var wordTimestamps = [];
  if (intervals.length > 0) {
    var cumulativeMs = 0;
    for (var t = 0; t < intervals.length; t++) {
      cumulativeMs += intervals[t];
      wordTimestamps.push(cumulativeMs / 1000.0);
    }
  }

  var animFrameId = null;

  function clearActiveTiming() {
    var activeChips = document.querySelectorAll('.word-chip.timing-active, .word-chip.timing-active-locked');
    activeChips.forEach(function(c) { 
      c.classList.remove('timing-active'); 
      c.classList.remove('timing-active-locked'); 
    });
  }

  function syncWordTiming() {
    var vid = document.getElementById('card-video');
    var targetBox = document.getElementById('target-box');
    if (!vid || !targetBox || wordTimestamps.length === 0) return;

    var currentTime = vid.currentTime;
    var activeIdx = -1;

    for (var i = wordTimestamps.length - 1; i >= 0; i--) {
      if (currentTime >= wordTimestamps[i]) {
        var nextTime = (i < wordTimestamps.length - 1) ? wordTimestamps[i + 1] : (wordTimestamps[i] + 0.6);
        if (currentTime < nextTime) {
          activeIdx = i;
        }
        break;
      }
    }

    var targetChips = targetBox.querySelectorAll('.word-chip');
    targetChips.forEach(function(chip, idx) {
      if (idx === activeIdx) {
        if (chip.dataset.lock === "true") {
          chip.classList.add('timing-active-locked');
          chip.classList.remove('timing-active');
        } else {
          chip.classList.add('timing-active');
          chip.classList.remove('timing-active-locked');
        }
      } else {
        chip.classList.remove('timing-active');
        chip.classList.remove('timing-active-locked');
      }
    });
  }

  window.initTimingSync = function() {
    var vid = document.getElementById('card-video');
    if (!vid || wordTimestamps.length === 0) return;

    function tick() {
      syncWordTiming();
      if (!vid.paused && !vid.ended) {
        animFrameId = requestAnimationFrame(tick);
      }
    }

    function onPlay() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      animFrameId = requestAnimationFrame(tick);
    }

    function onPause() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      syncWordTiming();
    }

    function onEnded() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      clearActiveTiming();
    }

    vid.removeEventListener('play', onPlay);
    vid.removeEventListener('pause', onPause);
    vid.removeEventListener('ended', onEnded);
    vid.removeEventListener('seeked', syncWordTiming);

    vid.addEventListener('play', onPlay);
    vid.addEventListener('pause', onPause);
    vid.addEventListener('ended', onEnded);
    vid.addEventListener('seeked', syncWordTiming);

    if (!vid.paused && !vid.ended) {
      tick();
    }
  };

  window.replayVideo = function() {
    var vid = document.getElementById('card-video');
    if (vid) {
      clearActiveTiming();
      vid.currentTime = 0;
      vid.muted = false;
      vid.play();
    }
  };

  setTimeout(function() {
    window.scrollTo(0, 0);
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }
    window.initTimingSync();
  }, 150);

  var sentenceElem = document.getElementById('hidden-sentence');
  if (!sentenceElem) return;

  var originalText = sentenceElem.innerText.trim();
  if (!originalText) return;

  var originalWords = originalText.split(/\s+/).filter(Boolean);
  var numLocked = originalWords.length >= 13 ? 2 : (originalWords.length >= 6 ? 1 : 0);
  var numDummies = originalWords.length <= 5 ? 2 : 1;

  function normalize(w) {
    return (w || '').toLowerCase().replace(/[^\w]/g, '');
  }

  var originalNormSet = new Set(originalWords.map(normalize));

  var dummyElem = document.getElementById('hidden-dummy');
  var dummyRaw = (dummyElem ? dummyElem.innerText.trim() : '');
  if (!dummyRaw) {
    dummyRaw = 'english';
  }

  function filterValidDummies(list) {
    return list.filter(function(cand) {
      var trimmed = cand.trim();
      return trimmed.length > 0 && !originalNormSet.has(normalize(trimmed));
    });
  }

  function shuffle(array) {
    var arr = array.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;
    }
    return arr;
  }

  function pickDummies(candidates, count) {
    var validList = filterValidDummies(candidates);
    var shuffled = shuffle(validList);
    return shuffled.slice(0, count);
  }

  function startWithDummies(dummyWords) {
    var lockedItems = [];
    var movableWords = [];

    if (numLocked > 0) {
      movableWords = originalWords.slice(0, originalWords.length - numLocked);
      for (var i = originalWords.length - numLocked; i < originalWords.length; i++) {
        lockedItems.push({ id: 'lock-' + i, text: originalWords[i], locked: true });
      }
    } else {
      movableWords = originalWords.slice();
    }

    var fullPool = movableWords.concat(dummyWords).map(function(w, i) {
      return { id: i + 1, text: w };
    });

    var available = shuffle(fullPool);
    var selected = [];
    var draggedData = null;
    var hasAnimatedLock = false;

    var placeholder = document.createElement('div');
    placeholder.className = 'chip-placeholder';

    function removePlaceholder() {
      if (placeholder.parentNode) {
        placeholder.parentNode.removeChild(placeholder);
      }
    }

    function getDragAfterElement(container, x, y) {
      var chips = Array.from(container.querySelectorAll('.word-chip:not(.dragging):not(.drag-hidden):not(.locked-chip)'));
      for (var i = 0; i < chips.length; i++) {
        var box = chips[i].getBoundingClientRect();
        var boxCenter = box.left + box.width / 2;
        if (y < box.bottom && (y < box.top || x < boxCenter)) {
          return chips[i];
        }
      }
      return null;
    }

    function saveState() {
      var userText = selected.map(function(i) { return i.text; }).join(' ');
      var unusedWords = available.map(function(i) { return i.text; });
      var isCorrect = (userText === originalWords.join(' '));
      var payload = JSON.stringify({
        sentence: originalText,
        userText: userText,
        unusedWords: unusedWords,
        isCorrect: isCorrect
      });
      try {
        localStorage.setItem("anki_shuffle_state", payload);
      } catch(e) {}
      try {
        window.name = payload;
      } catch(e) {}
    }

    function renderBoxes() {
      removePlaceholder();
      var targetBox = document.getElementById('target-box');
      var sourceBox = document.getElementById('source-box');
      if (!targetBox || !sourceBox) return;

      targetBox.innerHTML = '';
      sourceBox.innerHTML = '';

      selected.forEach(function(item, index) {
        targetBox.appendChild(createChip(item, 'target', index));
      });

      var userItems = selected.filter(function(item) { return !item.locked; });
      if (userItems.length === 0) {
        var phBox = document.createElement('div');
        phBox.className = 'placeholder-box';
        phBox.innerText = 'Tap or drag words here...';
        var firstLocked = targetBox.querySelector('.locked-chip');
        if (firstLocked) {
          targetBox.insertBefore(phBox, firstLocked);
        } else {
          targetBox.appendChild(phBox);
        }
      }

      available.forEach(function(item, index) {
        sourceBox.appendChild(createChip(item, 'source', index));
      });

      saveState();
      setupBoxEvents(targetBox, sourceBox);
      if (typeof window.initTimingSync === 'function') window.initTimingSync();
    }

    function render() {
      var targetBox = document.getElementById('target-box');
      var sourceBox = document.getElementById('source-box');
      if (!targetBox || !sourceBox) return;

      if (numLocked > 0 && !hasAnimatedLock) {
        lockedItems.forEach(function(item) { available.push(item); });
        renderBoxes();

        // Measure relative offsets inside sourceBox before moving chips to targetBox
        var sourceElems = Array.from(sourceBox.querySelectorAll('[data-lock="true"]'));
        var sourceBoxRect1 = sourceBox.getBoundingClientRect();
        var startOffsets = sourceElems.map(function(el) {
          var rect = el.getBoundingClientRect();
          return {
            left: rect.left - sourceBoxRect1.left,
            top: rect.top - sourceBoxRect1.top
          };
        });
        var expandedHeight = sourceBox.offsetHeight;

        for (var i = 0; i < lockedItems.length; i++) {
          available.pop();
        }
        selected = lockedItems.slice();
        renderBoxes(); // targetBox expands, pushing sourceBox down to sourceBoxRect2

        var sourceBoxRect2 = sourceBox.getBoundingClientRect();
        var collapsedHeight = sourceBox.offsetHeight;

        sourceBox.style.height = expandedHeight + 'px';
        sourceBox.style.overflow = 'hidden';
        sourceBox.style.transition = 'height 0.8s ease-in-out';

        var targetElems = Array.from(targetBox.querySelectorAll('[data-lock="true"]'));

        targetElems.forEach(function(targetElem, i) {
          var sourceElem = sourceElems[i];
          var startOffset = startOffsets[i];
          if (sourceElem && targetElem && startOffset) {
            var endRect = targetElem.getBoundingClientRect();
            
            // Calculate absolute start position based on sourceBox's NEW post-render position
            var actualStartLeft = sourceBoxRect2.left + startOffset.left;
            var actualStartTop = sourceBoxRect2.top + startOffset.top;

            var dx = actualStartLeft - endRect.left;
            var dy = actualStartTop - endRect.top;

            targetElem.classList.remove('locked-chip');
            targetElem.style.setProperty('--dx', dx + 'px');
            targetElem.style.setProperty('--dy', dy + 'px');
            targetElem.style.translate = dx + 'px ' + dy + 'px';
            targetElem.style.pointerEvents = 'none';

            targetElem.offsetHeight;

            var animDelay = 400 + (i * 150);
            var animDuration = 750;

            setTimeout(function() {
              targetElem.classList.add('locked-chip');
              targetElem.style.animation = 'glide ' + (animDuration / 1000) + 's ease-in-out forwards, pop ' + (animDuration / 1000) + 's ease-in-out forwards';
              if (i === 0) {
                sourceBox.style.height = collapsedHeight + 'px';
              }
            }, animDelay);

            setTimeout(function() {
              if (targetElem) {
                targetElem.style.animation = '';
                targetElem.style.translate = '';
                targetElem.style.removeProperty('--dx');
                targetElem.style.removeProperty('--dy');
                targetElem.style.pointerEvents = '';
              }
            }, animDelay + animDuration);
          }
        });

        var maxTotalTime = 400 + ((lockedItems.length - 1) * 150) + 750 + 100;
        setTimeout(function() {
          sourceBox.style.height = '';
          sourceBox.style.overflow = '';
          sourceBox.style.transition = '';
        }, maxTotalTime);

        hasAnimatedLock = true;
      } else {
        renderBoxes();
      }
    }

    function createChip(item, location, index) {
      var chip = document.createElement('div');
      chip.setAttribute('role', 'button');

      if (item.locked) {
        chip.dataset.lock = "true";
        chip.className = 'word-chip active-chip locked-chip';
        chip.innerText = item.text;
        chip.draggable = false;
        chip.onclick = function(e) {
          if (window.NarabikaeDict && window.NarabikaeDict.isSearchModeActive()) {
            e.stopPropagation();
            window.NarabikaeDict.lookupWord(item.text);
            return;
          }
          e.stopPropagation();
        };
        return chip;
      }

      chip.className = 'word-chip' + (location === 'target' ? ' active-chip' : '');
      chip.innerText = item.text;
      chip.draggable = true;

      chip.onclick = function(e) {
        if (window.NarabikaeDict && window.NarabikaeDict.isSearchModeActive()) {
          e.stopPropagation();
          window.NarabikaeDict.lookupWord(item.text);
          return;
        }

        if (location === 'target') {
          selected.splice(index, 1);
          available.push(item);
        } else {
          available.splice(index, 1);
          if (numLocked > 0) {
            selected.splice(selected.length - numLocked, 0, item);
          } else {
            selected.push(item);
          }
        }
        render();
      };

      chip.addEventListener('dragstart', function(e) {
        if (window.NarabikaeDict && window.NarabikaeDict.isSearchModeActive()) {
          e.preventDefault();
          return false;
        }
        draggedData = { item: item, location: location, index: index };
        placeholder.style.width = chip.offsetWidth + 'px';
        e.dataTransfer.effectAllowed = 'move';

        if (location === 'target') {
          setTimeout(function() {
            chip.classList.add('drag-hidden');
          }, 0);
        } else {
          chip.classList.add('dragging');
        }
      });

      chip.addEventListener('dragend', function() {
        chip.classList.remove('dragging');
        chip.classList.remove('drag-hidden');
        removePlaceholder();
        if (draggedData) {
          draggedData = null;
          render();
        }
      });

      return chip;
    }

    function setupBoxEvents(targetBox, sourceBox) {
      targetBox.ondragover = function(e) {
        e.preventDefault();
        if (!draggedData) return;
        var phBox = targetBox.querySelector('.placeholder-box');
        if (phBox) phBox.style.display = 'none';

        var afterElement = getDragAfterElement(targetBox, e.clientX, e.clientY);
        var lockedElems = targetBox.querySelectorAll('.locked-chip');
        var firstLocked = lockedElems.length > 0 ? lockedElems[0] : null;

        if (afterElement) {
          targetBox.insertBefore(placeholder, afterElement);
        } else if (firstLocked) {
          targetBox.insertBefore(placeholder, firstLocked);
        } else {
          targetBox.appendChild(placeholder);
        }
      };

      targetBox.ondragleave = function(e) {
        if (e.target === targetBox && !targetBox.contains(e.relatedTarget)) {
          removePlaceholder();
          var phBox = targetBox.querySelector('.placeholder-box');
          var userItems = selected.filter(function(item) { return !item.locked; });
          if (phBox && userItems.length === 0) {
            phBox.style.display = 'inline-flex';
          }
        }
      };

      targetBox.ondrop = function(e) {
        e.preventDefault();
        if (!draggedData) return;
        var children = Array.from(targetBox.querySelectorAll('.word-chip:not(.dragging):not(.drag-hidden), .chip-placeholder'));
        var insertIndex = children.indexOf(placeholder);
        if (insertIndex === -1) insertIndex = selected.length;

        if (draggedData.location === 'source') {
          available.splice(draggedData.index, 1);
          if (numLocked > 0) {
            insertIndex = Math.min(insertIndex, selected.length - numLocked);
          }
        } else {
          selected.splice(draggedData.index, 1);
          if (numLocked > 0) {
            insertIndex = Math.min(insertIndex, selected.length - numLocked);
          }
        }

        insertIndex = Math.max(0, Math.min(insertIndex, selected.length));
        selected.splice(insertIndex, 0, draggedData.item);
        draggedData = null;
        render();
      };

      sourceBox.ondragover = function(e) {
        e.preventDefault();
        removePlaceholder();
      };

      sourceBox.ondrop = function(e) {
        e.preventDefault();
        if (!draggedData || draggedData.item.locked) return;
        if (draggedData.location === 'target') {
          selected.splice(draggedData.index, 1);
          available.push(draggedData.item);
          draggedData = null;
          render();
        }
      };
    }

    window.resetShuffle = function() {
      available = shuffle(fullPool);
      selected = [];
      hasAnimatedLock = false;
      render();
    };

    render();
  }

  if (dummyRaw.includes(',')) {
    var rawList = dummyRaw.split(',');
    var picked = pickDummies(rawList, numDummies);
    startWithDummies(picked);
  } else {
    fetch('_dummyWords.json')
      .then(function(res) {
        if (!res.ok) throw new Error('File not found');
        return res.json();
      })
      .then(function(json) {
        var candidates = json[dummyRaw];
        if (Array.isArray(candidates)) {
          var picked = pickDummies(candidates, numDummies);
          if (picked.length > 0) {
            startWithDummies(picked);
            return;
          }
        }
        fallbackSingle();
      })
      .catch(function() {
        fallbackSingle();
      });

    function fallbackSingle() {
      var picked = pickDummies([dummyRaw], numDummies);
      startWithDummies(picked);
    }
  }
})();
</script>
