<div class="card-container">
  <div class="math-card">
    <div class="card-header">
      <span class="problem-badge">{{ProblemID}}</span>
    </div>
    
    <div class="math-viewport">
      <div id="math-question" class="math-content">
        <div class="loading-skeleton">
          <div class="spinner"></div>
          <span>Generating Problem...</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const el = document.getElementById('math-question');
  
  const renderMath = (latex) => {
    el.innerHTML = latex;
    if (window.MathJax) {
      MathJax.typesetPromise([el]);
    }
  };

  // Check if on the back side
  const isBack = !!document.getElementById('is-back-side');

  if (isBack) {
    const saved = sessionStorage.getItem('dynamic_math_state');
    if (saved) {
      const state = JSON.parse(saved);
      renderMath(state.q);
    }
    return;
  }

  // --- FRONT SIDE ONLY ---
  const id = "{{ProblemID}}".trim();
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  let state = {};

  let attempts = 0;
  const checkLimit = () => {
    if (++attempts > 200) {
      throw new Error("Couldn't find valid answers after 200 guesses");
    }
  };

  try {
    switch (id) {
      case "composition1": {
        let a, b, c, h_c, ans;
        attempts = 0;
        do {
          checkLimit();
          a = randInt(-2, 20);
          b = randInt(1, 5);
          c = randInt(-5, 6);
          h_c = (c * c) - b;
          ans = h_c / a;
        } while (h_c <= 0 || h_c % a !== 0);

        state = {
          q: `\\[\\begin{aligned} g(m) &= \\frac{m}{${a}} \\\\[4pt] h(m) &= m^2 - ${b} \\\\[4pt] (g \\circ h)(${c}) &= \\text{?} \\end{aligned}\\]`,
          sol: `\\[\\begin{aligned} (g \\circ h)(${c}) &= g(${h_c}) = \\mathbf{${ans}} \\end{aligned}\\]`
        };
        break;
      }

      case "composition2": {
        let a, b, c, h_c, ans;
        attempts = 0;
        do {
          checkLimit();
          a = randInt(-2, 20);
          b = randInt(1, 5);
          c = randInt(-5, 6);
          h_c = c + (b * b);
          ans = h_c / a;
        } while (h_c <= 0 || h_c % a !== 0);

        state = {
          q: `\\[\\begin{aligned}
          h(m) &= m + ${b}^2 \\\\[4pt]
          g(m) &= \\frac{m}{${a}} \\\\[4pt]
          (g \\circ h)(${c}) &= \\text{?}
          \\end{aligned}\\]`,
          sol: `\\[\\begin{aligned} (g \\circ h)(${c}) &= g(${h_c}) = \\mathbf{${ans}} \\end{aligned}\\]`
        };
        break;
      }

      case "composition3": {
        let a, b, c, n_c, ans;
        attempts = 0;
        do {
          checkLimit();
          a = randInt(-2, 5);
          b = randInt(13, 20);
          c = randInt(-4, 4);
          n_c = (a * c) - b;
          ans = n_c * n_c;
        } while (a === 0 || n_c === 0);

        state = {
          q: `\\[\\begin{aligned}
          n(m) &= ${a}m - ${b} \\\\[4pt]
          r(m) &= m^2 \\\\[4pt]
          (r \\circ n)(${c}) &= \\text{?}
          \\end{aligned}\\]`,
          sol: `\\[\\begin{aligned}
          (r \\circ n)(${c}) &= r(${n_c}) = \\mathbf{${ans}}
          \\end{aligned}\\]`
        };
        break;
      }

      case "compositionTEMPLATE": {
        let a, b, c, h_c, ans;
        attempts = 0;
        do {
          checkLimit();
          a = randInt(2, 5);
          b = randInt(1, 5);
          c = randInt(2, 6);
          h_c = (c * c) - b;
          ans = h_c / a;
        } while (h_c <= 0 || h_c % a !== 0);

        state = {
          q: `\\[\\begin{aligned} g(m) &= \\frac{m}{${a}} \\\\[4pt] h(m) &= m^2 - ${b} \\\\[4pt] (g \\circ h)(${c}) &= \\text{?} \\end{aligned}\\]`,
          sol: `\\[\\begin{aligned} 1.\\; h(${c}) &= ${c}^2 - ${b} = ${c*c} - ${b} = ${h_c} \\\\[8pt] 2.\\; (g \\circ h)(${c}) &= g(${h_c}) = \\frac{${h_c}}{${a}} = \\mathbf{${ans}} \\end{aligned}\\]`
        };
        break;
      }

      default:
        el.innerHTML = `<span style="color: var(--text-muted); font-style: italic;">Unknown ProblemID: "${id}"</span>`;
        return;
    }

    sessionStorage.setItem('dynamic_math_state', JSON.stringify(state));
    renderMath(state.q);

  } catch (err) {
    el.innerHTML = `<div class="error-box">⚠️ ${err.message}</div>`;
  }
})();
</script>
