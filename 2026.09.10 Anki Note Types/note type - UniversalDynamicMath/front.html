<!-- front.html - do not delete this line nor modify. v0.4 -->
<div style='font-family: "Arial"; font-size: 17px;'>{{ProblemID}}</div>
<div class="card-container">
  <div id="math-question">Generating problem...</div>
</div>

<script>
(function() {
  // Check if we are on the back side
  const isBack = !!document.getElementById('is-back-side');

  if (isBack) {
    // DO NOT generate new numbers — restore saved question from front
    const saved = sessionStorage.getItem('dynamic_math_state');
    if (saved) {
      const state = JSON.parse(saved);
      const el = document.getElementById('math-question');
      el.innerHTML = state.q;
      if (window.MathJax) MathJax.typesetPromise([el]);
    }
    return;
  }

  // --- FRONT SIDE ONLY: Generate new random numbers ---
  const id = "{{ProblemID}}".trim();
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  let state = {};

  // Loop safety guard
  let attempts = 0;
  const checkLimit = () => {
    if (++attempts > 200) {
      throw new Error("Couldn't find answers after 200 guesses");
    }
  };

  try {
    switch (id) {
      case "composition1": {
        let a, b, c, h_c, ans;
        attempts = 0;
        do {
          checkLimit();
          a = randInt(-2, 20);
          b = randInt(1, 5);
          c = randInt(6, -5);
          h_c = (c * c) - b;
          ans = h_c / a;
        } while (h_c <= 0 || h_c % a !== 0);

        state = {
          q: `\\[\\begin{aligned} g(m) &= \\frac{m}{${a}} \\\\[4pt] h(m) &= m^2 - ${b} \\\\[4pt] (g \\circ h)(${c}) &= \\text{?} \\end{aligned}\\]`,
          sol: `\\[\\begin{aligned} (g \\circ h)(${c}) &= g(${h_c}) = \\mathbf{${ans}} \\end{aligned}\\]`
        };
        break;
      }

      case "composition2": {
        let a, b, c, h_c, ans;
        attempts = 0;
        do {
            checkLimit();
            a = randInt(-2, 20);
            b = randInt(1, 5);
            c = randInt(-5, 6); // Fixed inverted order (-5 to 6)
            h_c = c + (b * b);  // Updated to match h(m) = m + b^2
            ans = h_c / a;
        } while (h_c <= 0 || h_c % a !== 0);

        state = {
            q: `\\[\\begin{aligned}
            h(m) &= m + ${b}^2 \\\\[4pt]
            g(m) &= \\frac{m}{${a}} \\\\[4pt]
            (g \\circ h)(${c}) &= \\text{?}
            \\end{aligned}\\]`,
            sol: `\\[\\begin{aligned} (g \\circ h)(${c}) &= g(${h_c}) = \\mathbf{${ans}} \\end{aligned}\\]`
        };
        break;
      }

      case "composition3": {
        let a, b, c, n_c, ans;
        ttempts = 0;
        do {
            checkLimit();
            a = randInt(-2, 5);
            b = randInt(13, 20);
            c = randInt(-4, 4);
            n_c = (a * c) - b;  // Inner function: n(c) = a*c - b
            ans = n_c * n_c;    // Outer function: r(n_c) = (n_c)^2
        } while (a === 0 || n_c === 0); // Re-roll trivial cases (a=0 or result=0)

        state = {
            q: `\\[\\begin{aligned}
            n(m) &= ${a}m - ${b} \\\\[4pt]
            r(m) &= m^2 \\\\[4pt]
            (r \\circ n)(${c}) &= \\text{?}
            \\end{aligned}\\]`,
            sol: `\\[\\begin{aligned}
            \\; (r \\circ n)(${c}) &= r(${n_c}) = \\mathbf{${ans}}
            \\end{aligned}\\]`
        };
        break;
      }

      case "compositionTEMPLATE": {
        let a, b, c, h_c, ans;
        attempts = 0;
        do {
          checkLimit();
          a = randInt(2, 5);
          b = randInt(1, 5);
          c = randInt(1, 1);
          h_c = (c * c) - b;
          ans = h_c / a;
        } while (h_c <= 0 || h_c % a !== 0);

        state = {
          q: `\\[\\begin{eqnarray*} g(m) &= \\frac{m}{${a}} \\\\[4pt] h(m) &= m^2 - ${b} \\\\[4pt] (g \\circ h)(${c}) &= \\text{?} \\end{eqnarray*}\\]`,
          sol: `\\[\\begin{aligned} 1.\\; h(${c}) &= ${c}^2 - ${b} = ${c*c} - ${b} = ${h_c} \\\\[8pt] 2.\\; (g \\circ h)(${c}) &= g(${h_c}) = \\frac{${h_c}}{${a}} = \\mathbf{${ans}} \\end{aligned}\\]`
        };
        break;
      }

      default:
        document.getElementById('math-question').innerHTML = `<em>Unknown ProblemID: "${id}"</em>`;
        return;
    }

    sessionStorage.setItem('dynamic_math_state', JSON.stringify(state));
    const el = document.getElementById('math-question');
    el.innerHTML = state.q;
    if (window.MathJax) MathJax.typesetPromise([el]);

  } catch (err) {
    const el = document.getElementById('math-question');
    el.innerHTML = `<span style="color: #d32f2f; font-weight: bold;">${err.message}</span>`;
  }
})();
</script>
