<div class="box">
<div class="front">{{Front}}</div>
<div class="back">
  {{Back}}
</div>

<!-- Custom Static Graphic -->
<div class="graphic-container">
    <img src="_eigo_tomaranai_v2.webp" style="pointer-events: none; user-select: none;">
</div>
</div>
<svg class="shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
  <!-- The 10-pointed smooth wavy badge background -->
  <path d="M 100,32 
           Q 128,13 140,45 
           Q 174,46 165,79 
           Q 192,100 165,121 
           Q 174,154 140,155 
           Q 128,188 100,168 
           Q 72,188 60,155 
           Q 26,154 35,121 
           Q 8,100 35,79 
           Q 26,46 60,45 
           Q 72,13 100,32 Z" 
        fill="#FF3DB7" />
</svg>

<script>
// Wrapping in a function prevents conflicting with other card scripts
(function() {
    const badge = document.querySelector('.shape');
    if (!badge) return;

    const rotationSpeed = 50 * 1000; // 10000ms = 10 seconds per full rotation. Lower = faster.

    function updateSpin() {
        // Calculate the exact angle based on the real-world timestamp
        const currentAngle = ((Date.now() % rotationSpeed) / rotationSpeed) * 360;
        badge.style.transform = `rotate(${currentAngle}deg)`;
        
        // Keeps the loop running smoothly at max frame rate
        requestAnimationFrame(updateSpin);
    }

    updateSpin();
})();
</script>
